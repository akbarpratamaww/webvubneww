<!-- Script untuk memuat header dan footer -->
<script>
  // Fungsi untuk memuat file HTML ke dalam elemen
  function loadHTML(file, elementId) {
    fetch(file)
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.text();
      })
      .then(data => {
        document.getElementById(elementId).innerHTML = data;
      })
      .catch(error => {
        console.error('Error loading HTML file:', error);
        document.getElementById(elementId).innerHTML = '<p>Konten tidak dapat dimuat.</p>';
      });
  }

  // Panggil fungsi saat halaman dimuat
  document.addEventListener('DOMContentLoaded', function() {
    loadHTML('header.html', 'header-placeholder');
    loadHTML('footer.html', 'footer-placeholder');
  });
  </script>

  <!-- Helper for jQuery selector that includes text -->
  <script>
    jQuery.expr[':'].contains = function(a, i, m) {
      return jQuery(a).text().toUpperCase().indexOf(m[3].toUpperCase()) >= 0;
    };
  </script>
